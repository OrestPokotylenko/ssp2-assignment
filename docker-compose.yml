name: southpark-messenger

services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-southpark}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-southpark}"
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-southpark}:${RABBITMQ_PASSWORD:-southpark}@rabbitmq:5672/"
      RABBITMQ_QUEUE: "${RABBITMQ_QUEUE:-southpark_messages}"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

  consumer:
    build:
      context: ./services/consumer
      dockerfile: Dockerfile
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-southpark}:${RABBITMQ_PASSWORD:-southpark}@rabbitmq:5672/"
      RABBITMQ_QUEUE: "${RABBITMQ_QUEUE:-southpark_messages}"
      RABBITMQ_RETRY_SECONDS: "${RABBITMQ_RETRY_SECONDS:-2}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  rabbitmq-data:
